manifestSchemaVersion: 3
appId: diagram-app
version: 1.0.3
displayName: "Diagram App"
icon: "src/assets/diagram-icon.svg"
banner: "src/assets/diagram-banner.png"
description: "Generates flowcharts, sequence diagrams, and ER diagrams as editable draw.io (.drawio) files."
publisher:
  id: quan-hoang
  displayName: "Quan Hoang(Hahn)"
  contact: quan.hoang@sotatek.com
contributes:
  skills:
    - name: drawio-diagrams
      description: How to author diagrams for the generate-diagram tool and how to read its result.
      appendsTo: system
      content: src/skills/drawio-diagrams
      timeoutMs: 3000
      failure_mode: skip
  tools:
    - name: generate-diagram
      description: >-
        Build a flowchart, sequence diagram, or ER diagram and return it as a complete,
        editable draw.io (.drawio) file that the user downloads from the rendered result.
        Send either a structured `spec` OBJECT (nodes/edges, participants/messages, or
        entities/relationships) or existing `mermaid` source to convert — never coordinates;
        layout and routing are computed here. Always pass `title`. Flowchart nodes accept an
        `icon` key naming an AWS service, which draws the official AWS icon instead of a box —
        use it for any AWS architecture diagram. Returns a one-line summary, element counts, and
        a `warnings` list naming any input that was skipped or approximated, which you should
        pass on to the user. Call this whenever a diagram, process chart, or data model is
        asked for, or when a .drawio/diagrams.net file is requested.
      route: POST /tools/generate-diagram
      inputSchema: src/schemas/generate-diagram-input.schema.json
      outputSchema: src/schemas/generate-diagram-output.schema.json
      timeoutMs: 15000
      failure_mode: abort
      searchHint: diagram drawio draw.io diagrams.net flowchart sequence erd entity relationship mermaid chart
  slashCommands:
    - verb: diagram
      scope: workspace
      description: Start a diagram of a system, flow, or data model.
      argumentHint: what to draw
      mode: insert-only
  ui:
    - id: diagram-composer-panel
      kind: nativeModule
      surface: composer-panel
      slot: chat.composer.panel
      label: Diagram starters
      module:
        entry: dist/ui/app.js
        export: DiagramComposerPanel
        styles: dist/ui/app.css
    - id: diagram-studio
      kind: nativeModule
      surface: page
      slot: admin.workspace.tab
      sectionId: diagram-app
      label: Diagram studio
      route: /diagram-app/*
      module:
        entry: dist/ui/app.js
        export: DiagramStudio
        styles: dist/ui/app.css
    - id: diagram-artifact
      kind: nativeModule
      surface: artifact
      slot: artifact.slot.diagram
      artifactKind: diagram
      label: Diagram
      retainContextWhenHidden: true
      module:
        entry: dist/ui/app.js
        export: DiagramArtifact
        styles: dist/ui/app.css
    - id: diagram-result
      kind: nativeModule
      surface: tool-view
      slot: chat.message.inline.below
      label: Diagram
      toolNames:
        - generate-diagram
      renderBeforeOutput: true
      module:
        entry: dist/ui/app.js
        export: DiagramToolResult
        styles: dist/ui/app.css
config:
  # `both`, so a value set for the organisation can be overridden by a workspace
  # that runs on a different cloud. The host asks for workspace-scoped config on
  # the app's detail page, and an org-only declaration leaves that unavailable.
  scope: both
  schemaVersion: 1
  # Which cloud icon sets this installation draws. All three ship with the app;
  # an organisation that only runs on one cloud can switch the others off so the
  # tool stops offering them and the browser stops fetching their glyphs.
  schema:
    type: object
    additionalProperties: false
    properties:
      clouds.aws:
        type: boolean
        title: AWS service icons
        description: Draw official AWS architecture icons when a node names an aws-* service.
      clouds.azure:
        type: boolean
        title: Azure service icons
        description: Draw official Azure architecture icons when a node names an azure-* service.
      clouds.gcp:
        type: boolean
        title: Google Cloud service icons
        description: Draw official Google Cloud architecture icons when a node names a gcp-* service.
  defaults:
    clouds.aws: true
    clouds.azure: true
    clouds.gcp: true
service:
  baseUrl: https://diagram-app.sotaagents.net
health:
  url: https://diagram-app.sotaagents.net/health
  intervalSeconds: 60
environments:
  local:
    service:
      baseUrl: http://localhost:8787
    health:
      url: http://localhost:8787/health
platform: ^1.2.0
locales:
  default: en
  files:
    en: src/locales/en.json
